<?xml version="1.0" encoding="UTF-8"?>
<!--
  The tab icon: The Reflection. A harbor city above the waterline, and what
  shows in the water is a waveform, because what this machine sees of Boston
  is its voice. The tall slab is Hancock, the mast with the amber beacon is
  the Pru, the pyramid top is Custom House, and the green below is the radio.

  This replaced the blackletter B in August 2026. The B needed a font stack
  and prayed the viewer's OS had something gothic; this is pure geometry, so
  it renders identically everywhere and still reads at 16 pixels, which is
  the only size that matters here. The route, the ASSETS entry and the <link>
  in index.html all name this file, not what is inside it, so swapping the
  mark again is a one-file change.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#05070b"/>
  <rect x="2" y="2" width="60" height="60" rx="10" fill="none" stroke="#232c3b" stroke-width="2"/>
  <g fill="#233043">
    <rect x="12" y="17" width="11" height="15"/>
    <rect x="27" y="23" width="9" height="9"/>
    <rect x="40" y="20" width="10" height="12"/>
    <path d="M40,20 h10 l-5,-6 Z"/>
  </g>
  <rect x="30.6" y="15" width="1.8" height="8" fill="#3a4a63"/>
  <circle cx="31.5" cy="13" r="2.2" fill="#ffb020"/>
  <line x1="9" y1="34" x2="55" y2="34" stroke="#2b3850" stroke-width="2"/>
  <g stroke="#34d399" stroke-width="4.6" stroke-linecap="round">
    <line x1="17" y1="39" x2="17" y2="52"/>
    <line x1="31" y1="39" x2="31" y2="46"/>
    <line x1="45" y1="39" x2="45" y2="49"/>
  </g>
</svg>
